<!doctype html>
<!--
  Renders the Kise mark — backend/static/coin.svg, the same flat coin as the website's logo and
  favicon — at icon resolution. Used by render.sh with headless Chrome. ?variant= selects:
    coin     the coin alone on transparent (in-app asset, Android legacy icon)
    ios      the coin on a square dark tile (iOS icons must be opaque)
    fg       the coin at 66% for the Android adaptive-icon foreground (transparent)
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; overflow: hidden; }
  body { display: grid; place-items: center; }
  body.ios { background: radial-gradient(760px 620px at 80% -10%, #1b944f66, transparent 60%), linear-gradient(160deg, #152a1e, #0b1510); }
  img { width: 880px; height: 880px; filter: drop-shadow(0 40px 60px #00000066); }
  body.ios img { width: 700px; height: 700px; }
  body.fg img { width: 620px; height: 620px; }
</style>
</head>
<body>
  <img src="../../../backend/static/coin.svg" alt="">
  <script>document.body.className = new URLSearchParams(location.search).get('variant') || 'coin';</script>
</body>
</html>
